id: pm/input-audio
kind: pm
status: complete
feature: input-audio
source_intent:
  - README.md
  - docs/roadmap/input-audio/README.md
runtime:
  root: .meta/multipass/runtime/loops/pm/input-audio
  activity: activity.ndjson
artifacts:
  durable_summary: .meta/multipass/state/pm-loops/input-audio.md
  product_docs: docs/roadmap/input-audio
work:
  branch: main
  worktree: .
phases:
  observe: observe
  orient: orient
  decide: decide
  act: act
  evidence: evidence
freshness:
  output_state: PM lane artifacts for Input Audio, not product implementation.
  stale_when:
    - docs/roadmap/input-audio artifacts change.
    - project orientation or feature-readiness evidence changes Input Audio readiness.
    - a product-owner prototype decision is recorded.

actors:
  observe:
    - actor: pm-readiness-observer
      cadence: 2h
      prompt: project/actors/pm-readiness-observer/prompt.md
      actions: project/actors/pm-readiness-observer/actions.yaml
      tick: >
        Observe Input Audio PM artifact readiness. Record existing artifacts,
        missing readiness gates, product-owner decision needs, and whether the
        lane is ready for promotion. Do not write inbox requests or modify
        roadmap artifacts.
  orient:
    - actor: pm-orienter
      cadence: 30m
      prompt: project/actors/pm-orienter/prompt.md
      actions: project/actors/pm-orienter/actions.yaml
      tick: >
        Interpret Input Audio PM observations against README intent and current
        feature-readiness evidence. Identify the next PM artifact gap or lock.
        Do not schedule work.
  decide:
    - actor: pm-decider
      cadence: 30m
      prompt: project/actors/pm-decider/prompt.md
      actions: project/actors/pm-decider/actions.yaml
      tick: >
        Decide one bounded PM-loop action for Input Audio from the latest PM
        orientation. Route only PM artifact work or a loop-local lock; do not
        promote a build loop.
  act:
    - actor: pm-artifact-author
      cadence: on_inbox
      prompt: project/actors/pm-artifact-author/prompt.md
      actions: project/actors/pm-artifact-author/actions.yaml
      resource_keys: mutate:pm:input-audio

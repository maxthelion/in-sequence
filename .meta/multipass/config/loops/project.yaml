id: project
kind: project
status: active

actors:
  observe:
    - actor: bug-observer
      cadence: 5m
      tick: >
        Observe unresolved owner bug reports under docs/bugs that lack
        resolution.md. Classify each by scope, priority, current routing state,
        and smallest honest next action. Record compact evidence only; orienter
        and decider route the work.
    - actor: feature-readiness-observer
      cadence: 2h
      tick: >
        Observe PM artifact readiness for promotion into build loops. Report
        ready-for-promotion, not-ready, stale/already-handled, and evidence
        freshness. Do not promote, schedule work, or write inbox messages.
    - actor: flow-observer
      cadence: 30m
      tick: >
        Observe portfolio flow from right to left: merge/closeout, active build
        WIP, available build capacity, ready PM handoffs, near-ready PM lanes,
        and upstream starvation risk. Record facts only; orienter interprets
        queue balance and timing.
    - actor: work-observer
      cadence: 2h
      tick: >
        Observe active work, completed actor outputs, and missing evidence.
        Update current work state. Do not write inbox messages; orienter
        interprets observations.
    - actor: loop-lifecycle-observer
      cadence: 1h
      tick: >
        Observe loop lifecycle facts: active branches already contained in
        main, terminal loops with open-message residue, missing worktrees, and
        blocked closeout. Record facts only; orienter interprets them.
    - actor: holistic-observer
      cadence: 4h
      tick: >
        Observe whole-product coherence against the README, roadmap intent, and
        recent observer outputs. Do not request product-owner attention unless
        genuinely needed.
    - actor: merge-observer
      cadence: 4h
      tick: >
        Observe merge candidates, branch containment, and merge freshness.
        Record facts only; orienter interprets them.
    - actor: rebase-observer
      cadence: 4h
      tick: >
        Observe branches and worktrees that are behind main or likely to need
        rebase. Record facts only; orienter interprets them.
    - actor: worktree-hygiene-observer
      cadence: 8h
      tick: >
        Observe worktrees that are merged, abandoned, dirty, stale, or
        ambiguous. Record cleanup candidates only; orienter interprets them.
    - actor: log-observer
      cadence: 2h
      tick: >
        Observe recent runtime logs and crash evidence. If a regression appears
        tied to active work, record the attribution evidence for orientation.
    - actor: process-health-observer
      cadence: 4h
      tick: >
        Observe loop health, token/resource churn, repeated failures, missing
        visibility, and brittle deterministic coupling. Write observations
        only; orienter/decider route any repair.
    - actor: holistic-ux-observer
      cadence: 24h
      tick: >
        Capture production screenshots of the main app surfaces using the
        project-local Peekaboo visual scenario, then observe wasted space,
        alignment/grid issues, unreadable controls, default styling leaks,
        screen-level user-story fit, and cross-screen design patterns. Write
        observations only; orienter/decider route any follow-up.
  decide:
    - actor: decider
      cadence: 10m
      tick: >
        Act as the project foreman: synthesize the fresh observer batch into a
        compact orientation snapshot, then decide the next useful project-level
        action in the same run. Use feature-readiness observations, bug intake,
        active build-loop state, and build capacity as context, not as a
        decision engine. Promote at most one ready feature into a build loop
        when there is capacity and the product priority is clear. If build
        capacity is available but no feature is ready, treat upstream starvation
        as a real throughput issue and start or advance one PM lane unless
        higher-priority active work would conflict with it.
  act:
    - actor: implementer
      cadence: on_inbox
      resource_keys: mutate:loop:project
    - actor: integrator
      cadence: on_inbox
      resource_keys: mutate:loop:project
    - actor: process-fixer
      cadence: on_inbox
      resource_keys: mutate:loop:project

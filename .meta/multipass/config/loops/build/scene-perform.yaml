id: build/scene-perform
kind: build
status: complete
feature: scene-perform
worktree: .worktrees/roadmap-2-scene-perform
branch: auto/roadmap-2-scene-perform
actors:
  orient:
    - actor: build-orienter
      cadence: 30m
      tick: >
        Interpret build-loop evidence pairings for scene-perform. Record what
        the evidence means; do not schedule work.
  decide:
    - actor: build-decider
      cadence: 30m
      tick: >
        Decide the next build-loop action for scene-perform from fresh
        orientation and evidence pairings.
  act:
    - actor: builder
      cadence: on_inbox
  observe:
    - actor: architecture-review
      cadence: on_inbox
    - actor: testing-review
      cadence: on_inbox
    - actor: ux-ia-review
      cadence: on_inbox
    - actor: visual-economy-review
      cadence: on_inbox
gates:
  - id: architecture
    actor: architecture-review
    checklist: architecture
  - id: testing
    actor: testing-review
    checklist: testing
  - id: ux
    actor: ux-ia-review
    checklist: ux
    when: user_facing
  - id: visual-economy
    actor: visual-economy-review
    checklist: visual-economy
    when: persistent_surface

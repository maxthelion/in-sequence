  <text x="316" y="586" fill="#9ca3af" font-family="Helvetica, Arial, sans-serif" font-size="11">-12</text>
  <text x="316" y="618" fill="#9ca3af" font-family="Helvetica, Arial, sans-serif" font-size="11">-36</text>
  <text x="184" y="654" fill="#eef0f5" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700">0 dB</text>

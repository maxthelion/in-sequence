<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slicer Track Prototype</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b10;
      --panel: #1c2028;
      --panel-2: #242934;
      --panel-3: #303541;
      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.18);
      --text: #f5f7fb;
      --muted: #9ca5b5;
      --cyan: #10c7f4;
      --green: #62d493;
      --orange: #ff8b2c;
      --red: #e24a40;
      --violet: #8b74ff;
      --shadow: 0 24px 90px rgba(0, 0, 0, 0.42);
      --radius: 8px;
      --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        linear-gradient(180deg, rgba(35, 40, 50, 0.78), rgba(8, 11, 16, 0.96) 300px),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      padding: 18px 22px 30px;
    }

    .shell {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(16, 19, 26, 0.92);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .topbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(24, 28, 36, 0.82);
    }

    .brand {
      font-size: 28px;
      font-weight: 850;
      letter-spacing: 0;
      margin-right: 20px;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 360px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.03);
    }

    .icon-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      color: var(--text);
      background: rgba(16, 199, 244, 0.18);
      border: 1px solid rgba(16, 199, 244, 0.45);
    }

    .record {
      background: rgba(255, 139, 44, 0.18);
      border-color: rgba(255, 139, 44, 0.48);
      color: var(--orange);
    }

    .bpm {
      appearance: none;
      width: 130px;
      height: 4px;
      accent-color: var(--cyan);
    }

    .tempo {
      min-width: 46px;
      font-size: 18px;
      font-weight: 760;
      text-align: right;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 0 24px 20px;
      background: rgba(24, 28, 36, 0.82);
    }

    .nav button,
    .pill {
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 760;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
    }

    .nav button.active {
      color: var(--text);
      border-color: rgba(16, 199, 244, 0.44);
      box-shadow: inset 0 -2px 0 var(--cyan);
    }

    .workspace {
      padding: 20px 24px 28px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(38, 43, 54, 0.95), rgba(30, 34, 43, 0.95));
      padding: 18px;
    }

    .panel-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .title {
      margin: 0;
      font-size: 26px;
      line-height: 1.05;
      letter-spacing: 0;
      font-weight: 850;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      color: var(--text);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 850;
    }

    .eyebrow::after {
      content: "";
      width: 38px;
      height: 2px;
      background: var(--cyan);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .primary,
    .secondary,
    .ghost {
      min-height: 34px;
      padding: 8px 12px;
      border-radius: var(--radius);
      color: var(--text);
      font-weight: 760;
      border: 1px solid transparent;
    }

    .primary {
      background: var(--cyan);
      color: #061119;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.06);
      border-color: var(--line-strong);
    }

    .ghost {
      background: transparent;
      color: var(--muted);
      border-color: var(--line);
    }

    .track-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
      gap: 12px;
    }

    .track-card {
      min-height: 138px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(45, 50, 62, 0.96), rgba(31, 35, 45, 0.96));
      padding: 14px;
      text-align: left;
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .track-card.selected {
      border-color: rgba(16, 199, 244, 0.78);
      box-shadow: inset 0 0 0 1px rgba(16, 199, 244, 0.28);
    }

    .track-card.pending {
      border-style: dashed;
      border-color: rgba(255, 139, 44, 0.72);
    }

    .track-kind {
      color: var(--cyan);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 850;
    }

    .track-name {
      font-size: 17px;
      line-height: 1.12;
      font-weight: 850;
      margin-top: 9px;
    }

    .track-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      font-weight: 650;
      margin-top: 6px;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, 320px);
      gap: 18px;
      align-items: stretch;
    }

    .wave-panel,
    .side-panel,
    .step-panel {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(18, 21, 28, 0.62);
      padding: 16px;
    }

    .wave-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 14px;
    }

    .sample-title {
      font-size: 22px;
      font-weight: 860;
      line-height: 1.1;
    }

    .sample-subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }

    .segmented {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.035);
    }

    .segmented button {
      padding: 7px 12px;
      border-radius: 999px;
      color: var(--muted);
      background: transparent;
      font-weight: 760;
      font-size: 12px;
    }

    .segmented button.active {
      color: #071017;
      background: var(--cyan);
    }

    .wave-wrap {
      position: relative;
      height: 246px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px) 0 0 / 6.25% 100%,
        linear-gradient(180deg, rgba(0, 0, 0, 0.2), rgba(16, 199, 244, 0.04));
    }

    #waveform {
      width: 100%;
      height: 100%;
      display: block;
    }

    .slice-readout {
      position: absolute;
      left: 14px;
      top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius);
      background: rgba(4, 7, 12, 0.64);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(10px);
    }

    .slice-number {
      color: var(--cyan);
      font-weight: 900;
      letter-spacing: 0.08em;
      font-size: 12px;
      text-transform: uppercase;
    }

    .slice-label {
      font-weight: 800;
      font-size: 13px;
    }

    .slice-strip {
      display: grid;
      grid-template-columns: repeat(16, minmax(44px, 1fr));
      gap: 6px;
      margin-top: 12px;
      overflow-x: auto;
    }

    .slice-chip {
      height: 34px;
      border-radius: var(--radius);
      color: var(--muted);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 760;
    }

    .slice-chip.active {
      color: #071017;
      background: var(--green);
      border-color: rgba(98, 212, 147, 0.8);
    }

    .side-section + .side-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .side-title {
      color: var(--text);
      letter-spacing: 0.13em;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 850;
      margin-bottom: 10px;
    }

    .field {
      display: grid;
      grid-template-columns: 86px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 760;
    }

    .field input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
    }

    .route {
      display: grid;
      gap: 8px;
    }

    .route-node {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 42px;
      border-radius: var(--radius);
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 12px;
      font-weight: 760;
    }

    .route-node strong {
      font-size: 13px;
    }

    .route-node.accent {
      border-color: rgba(16, 199, 244, 0.5);
      background: rgba(16, 199, 244, 0.10);
    }

    .player-pool {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .player {
      min-height: 54px;
      display: grid;
      place-items: center;
      border-radius: var(--radius);
      border: 1px dashed rgba(255, 255, 255, 0.18);
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.03);
    }

    .player.active {
      color: #071017;
      background: var(--green);
      border-style: solid;
      border-color: rgba(98, 212, 147, 0.9);
    }

    .step-panel {
      margin-top: 18px;
      overflow-x: auto;
    }

    .step-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    .length-pills,
    .page-pills {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mini-pill {
      min-width: 38px;
      min-height: 30px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--muted);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 820;
    }

    .mini-pill.active {
      color: #071017;
      background: var(--cyan);
      border-color: var(--cyan);
    }

    .steps {
      display: grid;
      grid-template-columns: repeat(16, minmax(64px, 1fr));
      gap: 8px;
      min-width: 1080px;
    }

    .step {
      min-height: 76px;
      padding: 8px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid var(--line);
      color: var(--muted);
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      text-align: center;
    }

    .step.active {
      color: var(--text);
      background: rgba(16, 199, 244, 0.16);
      border-color: rgba(16, 199, 244, 0.55);
    }

    .step.current {
      box-shadow: inset 0 0 0 2px rgba(255, 139, 44, 0.85);
    }

    .step-num {
      font-size: 11px;
      font-weight: 850;
    }

    .step-slice {
      font-size: 15px;
      font-weight: 900;
      color: var(--text);
    }

    .step-mode {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 850;
    }

    .empty-state {
      min-height: 380px;
      display: grid;
      place-items: center;
      text-align: center;
      border: 1px dashed rgba(255, 255, 255, 0.16);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.025);
    }

    .empty-state h2 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .empty-state p {
      margin: 0 0 18px;
      color: var(--muted);
      font-weight: 650;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      background: rgba(3, 5, 8, 0.72);
      backdrop-filter: blur(9px);
      padding: 24px;
    }

    .modal-backdrop.open {
      display: grid;
    }

    .modal {
      width: min(900px, calc(100vw - 48px));
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: linear-gradient(180deg, #242935, #191d26);
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.55);
      padding: 18px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 14px;
    }

    .modal-title {
      margin: 0;
      font-size: 24px;
      font-weight: 860;
    }

    .loop-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    @media (min-width: 1380px) {
      .track-grid {
        grid-template-columns: repeat(8, minmax(124px, 1fr));
      }
    }

    @media (max-width: 980px) {
      .app {
        padding: 10px;
      }

      .brand {
        width: 100%;
      }

      .transport {
        min-width: 0;
        width: 100%;
      }

      .bpm {
        width: min(130px, 24vw);
      }

      .workspace,
      .topbar,
      .nav {
        padding-left: 14px;
        padding-right: 14px;
      }

      .panel {
        padding: 14px;
      }

      .editor-grid {
        grid-template-columns: 1fr;
      }

      .loop-list {
        grid-template-columns: 1fr;
      }
    }

    .loop-card {
      min-height: 98px;
      text-align: left;
      color: var(--text);
      border-radius: 14px;
      border: 1px solid var(--line);
      background:
        linear-gradient(90deg, rgba(16, 199, 244, 0.18), transparent 42%),
        rgba(255, 255, 255, 0.045);
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px;
      gap: 14px;
      align-items: center;
    }

    .loop-card:hover,
    .loop-card:focus-visible {
      outline: 0;
      border-color: rgba(16, 199, 244, 0.75);
    }

    .loop-name {
      font-size: 17px;
      font-weight: 850;
      margin-bottom: 6px;
    }

    .loop-meta {
      color: var(--muted);
      font-size: 12px;
      font-weight: 680;
      line-height: 1.35;
    }

    .mini-wave {
      height: 54px;
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent),
        repeating-linear-gradient(90deg, rgba(98, 212, 147, 0.7) 0 4px, rgba(98, 212, 147, 0.18) 4px 9px);
      opacity: 0.9;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="shell">
      <header class="topbar">
        <div class="brand">SequencerAI</div>
        <div class="transport" aria-label="Transport">
          <button class="icon-button" aria-label="Play">Play</button>
          <button class="icon-button record" aria-label="Record">Rec</button>
          <input class="bpm" type="range" min="60" max="180" value="118" aria-label="BPM">
          <div class="tempo">118</div>
          <span class="pill">Free</span>
        </div>
      </header>

      <nav class="nav" aria-label="Workspace">
        <button>Phrase</button>
        <button class="active">Tracks</button>
        <button>Mixer</button>
        <button>Scenes</button>
        <button>Library</button>
      </nav>

      <section class="workspace">
        <section class="panel">
          <div class="panel-header">
            <div>
              <div class="eyebrow">Tracks</div>
              <h1 class="title">Track View</h1>
            </div>
            <div class="actions">
              <button class="secondary">Add Mono</button>
              <button class="secondary">Add Poly</button>
              <button class="primary" id="addSlice">Add Slice</button>
              <button class="secondary">Add Drum Group</button>
            </div>
          </div>

          <div class="track-grid" id="trackGrid"></div>
        </section>

        <section class="panel" id="mainDetail">
          <div class="empty-state">
            <div>
              <h2>Main Track</h2>
              <p>Select or create a slice track to open the loop slicer.</p>
              <button class="primary" id="emptyAddSlice">Add Slice Track</button>
            </div>
          </div>
        </section>
      </section>
    </div>
  </main>

  <div class="modal-backdrop" id="loopModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-head">
        <div>
          <div class="eyebrow">Loop Library</div>
          <h2 class="modal-title" id="modalTitle">Choose Drum Loop</h2>
        </div>
        <button class="ghost" id="closeModal">Cancel</button>
      </div>
      <div class="loop-list" id="loopList"></div>
    </div>
  </div>

  <template id="slicerTemplate">
    <div class="panel-header">
      <div>
        <div class="eyebrow">Slice Track</div>
        <h1 class="title" id="trackTitle">Break Slice</h1>
      </div>
      <div class="actions">
        <button class="secondary" id="chooseAnother">Choose Loop</button>
        <button class="ghost">Duplicate</button>
      </div>
    </div>

    <div class="editor-grid">
      <section class="wave-panel">
        <div class="wave-top">
          <div>
            <div class="sample-title" id="sampleName">Amen 92 BPM</div>
            <div class="sample-subtitle" id="sampleMeta">2 bars - 32 step clip - 16 auto slices</div>
          </div>
          <div class="segmented" aria-label="Slice mode">
            <button class="active" data-mode="grid">Grid</button>
            <button data-mode="transient">Transient</button>
            <button data-mode="manual">Manual</button>
          </div>
        </div>

        <div class="wave-wrap">
          <canvas id="waveform" width="1200" height="246"></canvas>
          <div class="slice-readout">
            <span class="slice-number" id="sliceNumber">S1</span>
            <span class="slice-label" id="sliceLabel">Kick pickup</span>
          </div>
        </div>
        <div class="slice-strip" id="sliceStrip"></div>
      </section>

      <aside class="side-panel">
        <div class="side-section">
          <div class="side-title">Track Settings</div>
          <div class="field">
            <label for="gain">Gain</label>
            <input id="gain" type="range" min="-24" max="12" value="0">
          </div>
          <div class="field">
            <label for="transpose">Transpose</label>
            <input id="transpose" type="range" min="-12" max="12" value="0">
          </div>
          <div class="field">
            <label for="voiceMode">Voice</label>
            <select id="voiceMode">
              <option>Mono</option>
              <option>Poly</option>
            </select>
          </div>
        </div>

        <div class="side-section">
          <div class="side-title">Sample Players</div>
          <div class="player-pool" id="playerPool"></div>
        </div>

        <div class="side-section">
          <div class="side-title">Audio Route</div>
          <div class="route">
            <div class="route-node"><span>Selected slice</span><strong id="routeSlice">S1</strong></div>
            <div class="route-node"><span>Voice</span><strong id="routeVoice">Player 1</strong></div>
            <div class="route-node accent"><span>Destination</span><strong>Break Slice Track</strong></div>
          </div>
        </div>
      </aside>
    </div>

    <section class="step-panel">
      <div class="step-toolbar">
        <div>
          <div class="eyebrow">Clip</div>
          <div class="sample-subtitle" id="clipSummary">Page 1 of 2 - step values trigger slices from the loop.</div>
        </div>
        <div class="actions">
          <div class="length-pills" id="lengthPills"></div>
          <div class="page-pills" id="pagePills"></div>
        </div>
      </div>
      <div class="steps" id="steps"></div>
    </section>
  </template>

  <script>
    const loops = [
      { name: "Amen 92 BPM", bpm: 92, bars: 2, steps: 32, slices: 16, color: "#10c7f4" },
      { name: "Think Break 115", bpm: 115, bars: 2, steps: 32, slices: 16, color: "#62d493" },
      { name: "Funky Drummer 96", bpm: 96, bars: 4, steps: 64, slices: 16, color: "#ff8b2c" },
      { name: "Electro Loop 128", bpm: 128, bars: 1, steps: 16, slices: 16, color: "#8b74ff" }
    ];

    const sliceNames = [
      "Kick pickup", "Hat push", "Snare", "Ghost", "Kick", "Open hat", "Snare drag", "Perc",
      "Kick drop", "Hat", "Snare hit", "Shuffle", "Kick tail", "Ride", "Snare fill", "Loop turn"
    ];

    const state = {
      selectedTrack: "main",
      sliceTrackCreated: false,
      pendingSliceTrack: false,
      loop: null,
      selectedSlice: 0,
      clipLength: 32,
      page: 0,
      currentStep: 4,
      steps: Array.from({ length: 64 }, (_, index) => {
        if (index % 4 === 0) return (index / 4) % 16;
        if (index % 4 === 2) return ((index / 2) + 2) % 16;
        return null;
      })
    };

    const trackGrid = document.querySelector("#trackGrid");
    const mainDetail = document.querySelector("#mainDetail");
    const loopModal = document.querySelector("#loopModal");
    const loopList = document.querySelector("#loopList");

    document.querySelector("#addSlice").addEventListener("click", () => {
      state.pendingSliceTrack = true;
      state.selectedTrack = "slice";
      renderTracks();
      openLoopModal();
    });

    document.querySelector("#emptyAddSlice").addEventListener("click", () => {
      state.pendingSliceTrack = true;
      state.selectedTrack = "slice";
      renderTracks();
      openLoopModal();
    });

    document.querySelector("#closeModal").addEventListener("click", closeLoopModal);

    loopModal.addEventListener("click", (event) => {
      if (event.target === loopModal) closeLoopModal();
    });

    function renderTracks() {
      const cards = [
        { id: "main", kind: "Single", name: "Main Track", meta: "Mono - P1 - default synth" },
        { id: "poly", kind: "Poly", name: "Poly 2", meta: "Poly - P1 - no destination" }
      ];

      if (state.pendingSliceTrack || state.sliceTrackCreated) {
        cards.push({
          id: "slice",
          kind: "Slice",
          name: state.loop ? "Break Slice" : "New Slice Track",
          meta: state.loop
            ? `${state.loop.name} - ${state.loop.slices} slices`
            : "Choose a drum loop"
        });
      }

      trackGrid.innerHTML = cards.map(card => `
        <button class="track-card ${state.selectedTrack === card.id ? "selected" : ""} ${card.id === "slice" && !state.loop ? "pending" : ""}" data-track="${card.id}">
          <div>
            <div class="track-kind">${card.kind}</div>
            <div class="track-name">${card.name}</div>
          </div>
          <div class="track-meta">${card.meta}</div>
        </button>
      `).join("");

      trackGrid.querySelectorAll(".track-card").forEach(card => {
        card.addEventListener("click", () => {
          const id = card.dataset.track;
          state.selectedTrack = id;
          if (id === "slice" && !state.loop) {
            openLoopModal();
          } else {
            renderDetail();
          }
          renderTracks();
        });
      });
    }

    function renderLoopList() {
      loopList.innerHTML = loops.map((loop, index) => `
        <button class="loop-card" data-loop="${index}">
          <div>
            <div class="loop-name">${loop.name}</div>
            <div class="loop-meta">${loop.bpm} BPM - ${loop.bars} bars - ${loop.steps} step clip<br>${loop.slices} auto slices on create</div>
          </div>
          <div class="mini-wave"></div>
        </button>
      `).join("");

      loopList.querySelectorAll(".loop-card").forEach(card => {
        card.addEventListener("click", () => {
          const loop = loops[Number(card.dataset.loop)];
          state.loop = loop;
          state.clipLength = loop.steps;
          state.page = 0;
          state.pendingSliceTrack = false;
          state.sliceTrackCreated = true;
          state.selectedTrack = "slice";
          closeLoopModal();
          renderTracks();
          renderDetail();
        });
      });
    }

    function openLoopModal() {
      renderLoopList();
      loopModal.classList.add("open");
    }

    function closeLoopModal() {
      loopModal.classList.remove("open");
      renderDetail();
    }

    function renderDetail() {
      if (state.selectedTrack !== "slice" || !state.loop) {
        mainDetail.innerHTML = `
          <div class="empty-state">
            <div>
              <h2>${state.selectedTrack === "poly" ? "Poly 2" : "Main Track"}</h2>
              <p>Select or create a slice track to open the loop slicer.</p>
              <button class="primary" id="emptyAddSlice">Add Slice Track</button>
            </div>
          </div>
        `;
        mainDetail.querySelector("#emptyAddSlice").addEventListener("click", () => {
          state.pendingSliceTrack = true;
          state.selectedTrack = "slice";
          renderTracks();
          openLoopModal();
        });
        return;
      }

      const template = document.querySelector("#slicerTemplate");
      mainDetail.innerHTML = "";
      mainDetail.appendChild(template.content.cloneNode(true));

      mainDetail.querySelector("#chooseAnother").addEventListener("click", openLoopModal);
      mainDetail.querySelector("#sampleName").textContent = state.loop.name;
      mainDetail.querySelector("#sampleMeta").textContent =
        `${state.loop.bars} bars - ${state.loop.steps} step clip - ${state.loop.slices} auto slices`;

      mainDetail.querySelectorAll(".segmented button").forEach(button => {
        button.addEventListener("click", () => {
          mainDetail.querySelectorAll(".segmented button").forEach(other => other.classList.remove("active"));
          button.classList.add("active");
          drawWaveform();
        });
      });

      renderSliceStrip();
      renderPlayerPool();
      renderLengthPills();
      renderPages();
      renderSteps();
      updateSliceReadout();
      requestAnimationFrame(drawWaveform);
    }

    function renderSliceStrip() {
      const strip = mainDetail.querySelector("#sliceStrip");
      strip.innerHTML = Array.from({ length: 16 }, (_, index) => `
        <button class="slice-chip ${state.selectedSlice === index ? "active" : ""}" data-slice="${index}">S${index + 1}</button>
      `).join("");
      strip.querySelectorAll(".slice-chip").forEach(chip => {
        chip.addEventListener("click", () => {
          state.selectedSlice = Number(chip.dataset.slice);
          renderDetail();
        });
      });
    }

    function renderPlayerPool() {
      const pool = mainDetail.querySelector("#playerPool");
      const active = state.selectedSlice % 4;
      pool.innerHTML = Array.from({ length: 4 }, (_, index) => `
        <div class="player ${index === active ? "active" : ""}">Player ${index + 1}</div>
      `).join("");
    }

    function renderLengthPills() {
      const host = mainDetail.querySelector("#lengthPills");
      host.innerHTML = [16, 32, 64].map(length => `
        <button class="mini-pill ${state.clipLength === length ? "active" : ""}" data-length="${length}">${length}</button>
      `).join("");
      host.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          state.clipLength = Number(button.dataset.length);
          state.page = Math.min(state.page, pageCount() - 1);
          renderDetail();
        });
      });
    }

    function renderPages() {
      const pages = mainDetail.querySelector("#pagePills");
      pages.innerHTML = Array.from({ length: pageCount() }, (_, index) => `
        <button class="mini-pill ${state.page === index ? "active" : ""}" data-page="${index}">${index + 1}</button>
      `).join("");
      pages.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          state.page = Number(button.dataset.page);
          renderDetail();
        });
      });
    }

    function renderSteps() {
      const start = state.page * 16;
      const steps = mainDetail.querySelector("#steps");
      mainDetail.querySelector("#clipSummary").textContent = `Page ${state.page + 1} of ${pageCount()} - ${state.clipLength} step clip`;
      steps.innerHTML = Array.from({ length: 16 }, (_, offset) => {
        const stepIndex = start + offset;
        const sliceIndex = state.steps[stepIndex];
        const active = sliceIndex !== null && stepIndex < state.clipLength;
        const current = stepIndex === state.currentStep;
        return `
          <button class="step ${active ? "active" : ""} ${current ? "current" : ""}" data-step="${stepIndex}">
            <span class="step-num">${stepIndex + 1}</span>
            <span class="step-slice">${active ? `S${sliceIndex + 1}` : "-"}</span>
            <span class="step-mode">${active ? "slice" : "off"}</span>
          </button>
        `;
      }).join("");

      steps.querySelectorAll(".step").forEach(step => {
        step.addEventListener("click", () => {
          const index = Number(step.dataset.step);
          if (index >= state.clipLength) return;
          const current = state.steps[index];
          state.steps[index] = current === null ? state.selectedSlice : (current + 1) % 16;
          state.selectedSlice = state.steps[index];
          renderDetail();
        });
      });
    }

    function updateSliceReadout() {
      const slice = state.selectedSlice;
      mainDetail.querySelector("#sliceNumber").textContent = `S${slice + 1}`;
      mainDetail.querySelector("#sliceLabel").textContent = sliceNames[slice];
      mainDetail.querySelector("#routeSlice").textContent = `S${slice + 1}`;
      mainDetail.querySelector("#routeVoice").textContent = `Player ${(slice % 4) + 1}`;
    }

    function pageCount() {
      return Math.max(1, Math.ceil(state.clipLength / 16));
    }

    function drawWaveform() {
      const canvas = mainDetail.querySelector("#waveform");
      if (!canvas) return;

      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * ratio);
      canvas.height = Math.floor(rect.height * ratio);
      const ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);

      const width = rect.width;
      const height = rect.height;
      ctx.clearRect(0, 0, width, height);

      const center = height / 2;
      const bars = 180;
      const barWidth = width / bars;
      const color = state.loop ? state.loop.color : "#10c7f4";

      for (let i = 0; i < bars; i += 1) {
        const phase = i / bars;
        const pulse = Math.abs(Math.sin(phase * Math.PI * 12)) * 0.66;
        const noise = Math.abs(Math.sin((i + 3) * 1.73)) * 0.32;
        const transient = (i % 23 < 3 ? 0.9 : 0.0) + (i % 41 < 2 ? 0.62 : 0.0);
        const amp = Math.min(1, 0.18 + pulse + noise + transient);
        const h = amp * (height * 0.42);
        const x = i * barWidth;
        const gradient = ctx.createLinearGradient(0, center - h, 0, center + h);
        gradient.addColorStop(0, color);
        gradient.addColorStop(0.5, "rgba(255,255,255,0.82)");
        gradient.addColorStop(1, color);
        ctx.fillStyle = gradient;
        ctx.globalAlpha = 0.72;
        ctx.fillRect(x + 1, center - h, Math.max(1, barWidth - 2), h * 2);
      }
      ctx.globalAlpha = 1;

      for (let i = 0; i <= 16; i += 1) {
        const x = (i / 16) * width;
        const selectedEdge = i === state.selectedSlice || i === state.selectedSlice + 1;
        ctx.strokeStyle = selectedEdge ? "#62d493" : "rgba(16, 199, 244, 0.55)";
        ctx.lineWidth = selectedEdge ? 3 : 1;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();

        if (i < 16) {
          ctx.fillStyle = i === state.selectedSlice ? "rgba(98, 212, 147, 0.22)" : "rgba(255, 255, 255, 0.018)";
          ctx.fillRect(x, 0, width / 16, height);
          ctx.fillStyle = i === state.selectedSlice ? "#061119" : "rgba(245,247,251,0.72)";
          ctx.font = "700 11px " + getComputedStyle(document.body).fontFamily;
          if (i === state.selectedSlice) {
            ctx.fillStyle = "#62d493";
          }
          ctx.fillText("S" + (i + 1), x + 8, height - 12);
        }
      }

      canvas.onclick = event => {
        const bounds = canvas.getBoundingClientRect();
        const next = Math.max(0, Math.min(15, Math.floor((event.clientX - bounds.left) / bounds.width * 16)));
        state.selectedSlice = next;
        renderDetail();
      };
    }

    window.addEventListener("resize", drawWaveform);

    renderTracks();
    renderDetail();
  </script>
</body>
</html>
